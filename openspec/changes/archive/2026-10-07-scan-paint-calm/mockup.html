<title>Rauhallisempi skannimaali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: six phone-like camera frames in a 3x2 grid, a short caption under each, one motion toggle; stacks on phones. */
:root {
  --bg: #eef0f3;
  --fg: #1b1f27;
  --muted: #5c6472;
  --frame: #c9ccd2;
  --cam-top: #d9d2c6;
  --cam-bottom: #a99c88;
  --accent: #2f6fdc;
  --btn-fg: #ffffff;
  --body: "Lexend", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --fg: #e8eaee; --muted: #9aa2b0; --frame: #343a44;
    --cam-top: #5a5348; --cam-bottom: #362f27; --accent: #7aa7f5; --btn-fg: #0d1420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --fg: #e8eaee; --muted: #9aa2b0; --frame: #343a44;
  --cam-top: #5a5348; --cam-bottom: #362f27; --accent: #7aa7f5; --btn-fg: #0d1420; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font-family: var(--body); }
main { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 40px; display: grid; gap: 22px; }
h1 { font-size: 1.5rem; font-weight: 600; margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); max-width: 62ch; line-height: 1.5; }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 22px; min-height: 44px;
  background: var(--accent); color: var(--btn-fg); cursor: pointer; }
button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 18px; }
@media (max-width: 760px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 460px) { .grid { grid-template-columns: minmax(0, 1fr); max-width: 340px; margin-inline: auto; width: 100%; } }
figure { margin: 0; display: grid; gap: 10px; min-width: 0; align-content: start; }
.cam { border: 6px solid var(--frame); border-radius: 22px; overflow: hidden; aspect-ratio: 3 / 4; max-width: 100%;
  background: linear-gradient(180deg, var(--cam-top), var(--cam-bottom)); }
.cam svg { width: 100%; height: 100%; display: block; }
.tag { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
figcaption { display: grid; gap: 4px; }
figcaption b { font-weight: 600; }
figcaption span { color: var(--muted); line-height: 1.45; font-size: 0.92rem; }
/* Motion demo: the cube sways; proposals' paint fades while it moves, "now" lags behind instead. */
.moving .cube { animation: sway 4s ease-in-out infinite; transform-box: view-box; transform-origin: 150px 200px; }
.moving .fades { animation: fade 4s ease-in-out infinite; }
.moving .lags { animation: lag 4s ease-in-out infinite; transform-box: view-box; transform-origin: 150px 200px; }
@keyframes sway { 0%, 30% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(18px, 10px) rotate(-9deg); } 70%, 100% { transform: translate(0, 0) rotate(0deg); } }
@keyframes lag { 0%, 36% { transform: translate(0, 0) rotate(0deg); } 58% { transform: translate(30px, 18px) rotate(-14deg); } 80%, 100% { transform: translate(0, 0) rotate(0deg); } }
@keyframes fade { 0%, 28% { opacity: 1; } 36%, 64% { opacity: 0; } 76%, 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .moving .cube, .moving .fades, .moving .lags { animation: none; } }
</style>

<main>
  <h1>Rauhallisempi skannimaali</h1>
  <p class="lead">Sama kuutio kuudella tavalla: ylävasemmalla nykyinen, muut ehdotuksia. Kaikissa ehdotuksissa merkinnät haipuvat, kun kuutio liikkuu.</p>
  <div class="bar"><button id="toggle" type="button" aria-pressed="false">Liikuta kuutiota</button></div>
  <div class="grid" id="grid"></div>
</main>

<script>
const C = { W: "#f3f3ee", R: "#c81f2a", G: "#139a4f", Y: "#f3cf1d", O: "#ee7613", B: "#1650b2", grey: "#8d929a" };
// The 2026-10-07 test cube (URFDLB); in view: top U, left F, right R.
const TRUTH = "RRRRWWRWGWRGRRGGGGWGRWGGWWWOOOYYOBYOBBBOOBYOBYYYYBBYBO";
const net = n => TRUTH.substr("URFDLB".indexOf(n) * 9, 9);
const faces = {
  top:   { o: [46, 110], a: [104, -60], b: [104, 60], s: net("U"), side: "U" },
  left:  { o: [46, 110], a: [104, 60],  b: [0, 120],  s: net("F"), side: "F" },
  right: { o: [150, 170], a: [104, -60], b: [0, 120], s: net("R"), side: "R" },
};
// Stickers still needed, and two misread ones shown by the current paint.
const unknown = new Set(["right:6", "right:7", "right:8", "left:8"]);
const wrong = { "top:4": "B", "right:1": "W" };
const confirmed = new Set(["top", "left"]);
// Known stickers of the sides not in view, for the mini map (D, L, B partly).
const seenOther = { D: [0, 1, 2, 4], L: [4], B: [0, 1, 2, 3, 4, 5] };

const options = [
  { id: "now", tag: "Nyt", title: "Iso laatta jokaisen tarran päällä", text: "Puuttuvat katkoviivoilla. Liikkeessä laatat jäävät jälkeen ja menevät sivuun." },
  { id: "dots", tag: "A · pilkut", title: "Pieni pilkku tarran keskellä", text: "Oikea kuutio näkyy. Puuttuvissa himmeä rengas." },
  { id: "ring", tag: "B · reunus", title: "Ohut värireunus tarran sisällä", text: "Kertoo luetun värin kuten laatta, mutta peittää vain reunan." },
  { id: "veil", tag: "C · huntu puuttuville", title: "Vain puuttuvat merkitään", text: "Tunnetut jäävät koskematta, puuttuvien päällä harmaa huntu. Vähiten merkintöjä." },
  { id: "faces", tag: "D · valmiit sivut", title: "Merkintä vain valmiille sivulle", text: "Valmis sivu saa ohuen kehyksen ja rastin. Ei merkintöjä tarra kerrallaan." },
  { id: "map", tag: "E · kartta kulmassa", title: "Kamerakuva puhtaana, kartta kulmassa", text: "Pieni avattu kuutio täyttyy tarra kerrallaan. Ei mitään kuution päällä." },
];

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}
const thin = { "vector-effect": "non-scaling-stroke" };

function draw(svg, mode) {
  const cube = el("g", { class: "cube" }, svg);
  const marks = [];
  for (const name in faces) {
    const f = faces[name];
    const m = `matrix(${f.a[0]} ${f.a[1]} ${f.b[0]} ${f.b[1]} ${f.o[0]} ${f.o[1]})`;
    const g = el("g", { transform: m }, cube);
    el("rect", { x: 0, y: 0, width: 1, height: 1, fill: "#111" }, g);
    for (let i = 0; i < 9; i++) {
      const r = Math.floor(i / 3), c = i % 3;
      el("rect", { x: c / 3 + 0.03, y: r / 3 + 0.03, width: 1 / 3 - 0.06, height: 1 / 3 - 0.06, rx: 0.03, fill: C[f.s[i]] }, g);
    }
    // "now" paint lives outside the cube group so it can lag behind it; the others ride on the cube and fade.
    const host = mode === "now" ? el("g", { class: "lags" }, svg) : el("g", { class: "fades" }, cube);
    const p = el("g", { transform: m }, host);
    marks.push(p);
    for (let i = 0; i < 9; i++) {
      const r = Math.floor(i / 3), c = i % 3, key = name + ":" + i;
      const known = !unknown.has(key);
      const x = c / 3, y = r / 3, cx = x + 1 / 6, cy = y + 1 / 6;
      if (mode === "now") {
        if (known) el("rect", { x: x + 0.045, y: y + 0.005, width: 1 / 3 - 0.05, height: 1 / 3 - 0.05, rx: 0.02,
          fill: C[wrong[key] || f.s[i]], stroke: "#000", "stroke-width": 1, ...thin }, p);
        else el("rect", { x: x + 0.06, y: y + 0.02, width: 1 / 3 - 0.1, height: 1 / 3 - 0.1, fill: "rgba(255,255,255,0.15)",
          stroke: "#fff", "stroke-width": 1.2, "stroke-dasharray": "3 2", ...thin }, p);
      } else if (mode === "dots") {
        if (known) el("circle", { cx, cy, r: 0.045, fill: C[f.s[i]], stroke: "#fff", "stroke-width": 1.5, ...thin }, p);
        else el("circle", { cx, cy, r: 0.045, fill: "none", stroke: "rgba(255,255,255,0.75)", "stroke-width": 1.2, ...thin }, p);
      } else if (mode === "ring") {
        if (known) el("rect", { x: x + 0.055, y: y + 0.055, width: 1 / 3 - 0.11, height: 1 / 3 - 0.11, rx: 0.025, fill: "none",
          stroke: C[f.s[i]], "stroke-width": 3, ...thin }, p);
        if (known) el("rect", { x: x + 0.04, y: y + 0.04, width: 1 / 3 - 0.08, height: 1 / 3 - 0.08, rx: 0.03, fill: "none",
          stroke: "rgba(0,0,0,0.55)", "stroke-width": 1, ...thin }, p);
        else el("rect", { x: x + 0.055, y: y + 0.055, width: 1 / 3 - 0.11, height: 1 / 3 - 0.11, rx: 0.025, fill: "none",
          stroke: "rgba(255,255,255,0.6)", "stroke-width": 1.2, "stroke-dasharray": "2 3", ...thin }, p);
      } else if (mode === "veil") {
        if (!known) el("rect", { x: x + 0.025, y: y + 0.025, width: 1 / 3 - 0.05, height: 1 / 3 - 0.05, rx: 0.03, fill: "rgba(70,74,82,0.82)" }, p);
      }
    }
    if (mode === "faces" && confirmed.has(name)) {
      el("rect", { x: 0.01, y: 0.01, width: 0.98, height: 0.98, rx: 0.04, fill: "none", stroke: "#fff", "stroke-width": 2.5, ...thin }, p);
    }
  }
  if (mode === "faces") {
    // A tick near each confirmed side's centre, kept upright in screen space.
    const ticks = el("g", { class: "fades" }, cube);
    for (const name of confirmed) {
      const f = faces[name];
      const cx = f.o[0] + (f.a[0] + f.b[0]) / 2, cy = f.o[1] + (f.a[1] + f.b[1]) / 2;
      el("circle", { cx, cy, r: 13, fill: "rgba(20,24,30,0.72)" }, ticks);
      el("path", { d: `M${cx - 6} ${cy} l4 5 l8 -10`, fill: "none", stroke: "#fff", "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round" }, ticks);
    }
  }
  if (mode === "map") drawMap(svg);
}

// A small unfolded cube (net) in the bottom-left corner: known stickers in colour, the rest grey.
function drawMap(svg) {
  const s = 7.5, gap = 3, size = 3 * s + gap;
  const at = { U: [1, 0], L: [0, 1], F: [1, 1], R: [2, 1], B: [3, 1], D: [1, 2] };
  const box = el("g", { transform: "translate(14, 300)" }, svg);
  el("rect", { x: -7, y: -7, width: 4 * size + 11, height: 3 * size + 11, rx: 10, fill: "rgba(20,24,30,0.62)" }, box);
  for (const side of "URFDLB") {
    const [gx, gy] = at[side];
    const known = i => {
      if (side === "U") return !unknown.has("top:" + i);
      if (side === "F") return !unknown.has("left:" + i);
      if (side === "R") return !unknown.has("right:" + i);
      return seenOther[side].includes(i);
    };
    for (let i = 0; i < 9; i++) {
      const r = Math.floor(i / 3), c = i % 3;
      el("rect", { x: gx * size + c * s, y: gy * size + r * s, width: s - 1.2, height: s - 1.2, rx: 1.2,
        fill: known(i) ? C[net(side)[i]] : "rgba(255,255,255,0.18)" }, box);
    }
  }
}

const grid = document.getElementById("grid");
for (const o of options) {
  const fig = document.createElement("figure");
  fig.innerHTML = `<div class="cam"><svg viewBox="0 0 300 400" role="img" aria-label="${o.tag}: ${o.title}"></svg></div>
    <figcaption><span class="tag">${o.tag}</span><b>${o.title}</b><span>${o.text}</span></figcaption>`;
  grid.appendChild(fig);
  draw(fig.querySelector("svg"), o.id);
}
const btn = document.getElementById("toggle");
btn.addEventListener("click", () => {
  const on = grid.classList.toggle("moving");
  btn.setAttribute("aria-pressed", String(on));
  btn.textContent = on ? "Pysäytä kuutio" : "Liikuta kuutiota";
});
</script>
