schema: spec-driven

context: |
  Rubikki Solveri: Android app (and the same app in the browser) that scans a
  real 3x3 Rubik's Cube with the camera and helps the user solve it - the
  shortest solution move by move, or a human method taught stage by stage.
  Runs fully on the device, offline.

  Stack: Kotlin Multiplatform, Compose Multiplatform, Material 3, Gradle
  (Kotlin DSL). Modules: cube (pure Kotlin logic and solvers, JVM + Wasm),
  shared (all screens, texts, theme; Android + Wasm), app (Android shell:
  Room, DataStore, CameraX, file log), web (browser shell, Kotlin/Wasm).

  Always: English identifiers; UI text in Finnish and English (Compose
  resources in shared); light and dark theme; prefer established libraries over
  hand-written plumbing; every move shown must be unmistakable for a beginner;
  budget 0 EUR (no server, no paid API).

  Knowledge base - start planning here, then verify against the code:
  - docs/README.md: wiki front page
  - openspec/context/product.md: product decisions and ideas
  - openspec/context/roadmap.md: planned change order
  An existing spec in openspec/specs wins over docs/ and context/ files.

rules:
  proposal:
    - State which modules (cube, app) the change touches.
  specs:
    - Specs describe observable behaviour, never library or class names.
  tasks:
    - Each task group lands its own tests (cube logic as JVM unit tests; screens get a few Compose tests for key interactions).
    - Cube logic goes to the cube module before any screen uses it.
    - The last task group updates the docs/ pages the change affects and marks the roadmap item done.

operations:
  archive:
    guidance:
      - Before archiving, check that docs/ and roadmap.md reflect the change.
