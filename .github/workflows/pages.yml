name: Pages

# The browser version at https://jukkakot.github.io/rubikki-solveri/: every push to main builds
# it, smoke-tests it and publishes it (docs/operations.md → Browser version). Pages' source is
# "GitHub Actions" (set once through the API, see docs/operations.md → Builds).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Browser build
        run: ./gradlew :web:wasmJsBrowserDistribution
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test
        run: |
          npm ci --prefix web/smoke
          npx --prefix web/smoke playwright install --with-deps chromium
          node web/smoke/smoke.mjs web/build/dist/wasmJs/productionExecutable
      - name: Upload the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: web/build/smoke
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
