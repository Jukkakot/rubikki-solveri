name: Release

# Push a tag like v1.0 (or run by hand) to build a signed release APK and attach it to a GitHub
# release. Signing uses the RELEASE_* secrets (docs/operations.md → Release); without them the
# APK is signed with the runner's debug key, which still installs but cannot update a
# key-signed install.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Keystore from secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No RELEASE_KEYSTORE_BASE64 secret: the APK is signed with the debug key"
          fi
      - name: Tests, lint and release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'android' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'androiddebugkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'android' }}
        run: ./gradlew test lint assembleRelease
      - name: Name the APK after the version
        run: |
          cp app/build/outputs/apk/release/app-release.apk "rubikki-solveri-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk rubikki-solveri.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rubikki-solveri-release-${{ github.ref_name }}
          path: rubikki-solveri-*.apk
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rubikki-solveri-*.apk
            rubikki-solveri.apk
          body_path: .github/release-notes.md
